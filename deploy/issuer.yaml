apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-webhook-joker-selfsign
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-webhook-joker-webhook-tls
  namespace: cert-manager
spec:
  secretName: cert-manager-webhook-joker-webhook-tls
  dnsNames:
  - cert-manager-webhook-joker
  - cert-manager-webhook-joker.cert-manager
  - cert-manager-webhook-joker.cert-manager.svc
  issuerRef:
    name: cert-manager-webhook-joker-selfsign