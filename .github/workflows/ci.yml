name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cert-manager-webhook-joker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v ./internal/...

    - name: Run integration tests
      run: go test -v ./test/integration/...
      if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-integration-tests')

    - name: Lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

    - name: Check formatting
      run: |
        gofmt -d .
        if [ "$(gofmt -d . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Run 'go fmt ./...'"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'nauski'
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Kind
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: webhook-test
        kubectl_version: v1.28.0

    - name: Install cert-manager
      run: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.6/cert-manager.yaml
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=cert-manager -n cert-manager --timeout=300s

    - name: Create test secret
      run: |
        kubectl create secret generic joker-credentials \
          --from-literal=username="${{ secrets.JOKER_USERNAME }}" \
          --from-literal=password="${{ secrets.JOKER_PASSWORD }}" \
          -n cert-manager
      if: env.JOKER_USERNAME != '' && env.JOKER_PASSWORD != ''
      env:
        JOKER_USERNAME: ${{ secrets.JOKER_USERNAME }}
        JOKER_PASSWORD: ${{ secrets.JOKER_PASSWORD }}

    - name: Run conformance tests
      run: |
        export TEST_ZONE_NAME=${{ secrets.TEST_ZONE_NAME }}
        export TEST_SECRET_NAME=joker-credentials
        go test -v ./test/conformance/...
      if: env.TEST_ZONE_NAME != ''
      env:
        TEST_ZONE_NAME: ${{ secrets.TEST_ZONE_NAME }}

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test only)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: cert-manager-webhook-joker:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'